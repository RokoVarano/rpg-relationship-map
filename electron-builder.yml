appId: com.rpg-relationships.app
productName: Mapas de Relaciones RPG

directories:
  output: release

files:
  - dist/**/*
  - src/main/**/*
  - src/preload/**/*

win:
  target:
    - target: dir
      arch: [x64]
  artifactName: '${productName}-windows-x64'

linux:
  target:
    - target: dir
      arch: [x64]
  artifactName: '${productName}-linux-x64'
